name: Preview ServiceNow Jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preview_jobs.py'
      - '.github/workflows/preview-jobs.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Search ServiceNow jobs and show results in Summary
        run: python preview_jobs.py
