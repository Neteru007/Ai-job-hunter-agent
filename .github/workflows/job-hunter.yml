name: AI Job Hunter

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-job-hunter
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      MIN_NET_EUR: '8000'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate secrets
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing TELEGRAM_BOT_TOKEN" && exit 1)
          test -n "$TELEGRAM_ALLOWED_USER_ID" || (echo "Missing TELEGRAM_ALLOWED_USER_ID" && exit 1)
      - name: Search jobs and process Telegram approvals
        run: python scheduled_runner.py
      - name: Commit non-sensitive state
        if: always()
        run: |
          if [ -f state/jobs.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/jobs.json
            if ! git diff --cached --quiet; then
              git commit -m "Update job hunter search and approval state [skip ci]"
              git push
            fi
          fi
