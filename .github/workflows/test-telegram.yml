name: Test Telegram Connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-telegram.yml'

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
    steps:
      - name: Diagnose bot-specific Telegram API failures
        shell: bash
        run: |
          python3 - <<'PY'
          """Isolated connectivity test. Never log the bot token or token-bearing URL."""
          import json
          import os
          import socket
          import ssl
          import time
          import urllib.error
          import urllib.request

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_ALLOWED_USER_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_ALLOWED_USER_ID")
          bot_id = token.partition(":")[0]
          if not bot_id.isdigit() or ":" not in token:
              raise SystemExit("Invalid token format; check GitHub secret")

          # Explicit IPv4 and direct HTTPS avoid broken IPv6 routes and proxy ambiguity.
          original_getaddrinfo = socket.getaddrinfo
          def ipv4_only(host, port, family=0, type=0, proto=0, flags=0):
              return original_getaddrinfo(host, port, socket.AF_INET, type, proto, flags)
          socket.getaddrinfo = ipv4_only
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))

          def check(label, url, timeout=25, payload=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Content-Type": "application/json"} if payload is not None else {},
              )
              started = time.monotonic()
              try:
                  with opener.open(req, timeout=timeout) as response:
                      data = json.load(response)
                      print(label, "HTTP", response.status, "seconds", round(time.monotonic() - started, 1))
                      return response.status, data
              except urllib.error.HTTPError as exc:
                  try:
                      error = json.loads(exc.read())
                  except (ValueError, UnicodeDecodeError):
                      error = {}
                  print(label, "HTTP", exc.code, "seconds", round(time.monotonic() - started, 1))
                  print(label, "description", error.get("description", "not returned"))
                  print(label, "retry_after", error.get("parameters", {}).get("retry_after", "not specified"))
                  return exc.code, error
              except Exception as exc:
                  print(label, "error", type(exc).__name__, "seconds", round(time.monotonic() - started, 1))
                  return None, {}

          try:
              with socket.create_connection(("api.telegram.org", 443), timeout=6) as sock:
                  with ssl.create_default_context().wrap_socket(sock, server_hostname="api.telegram.org") as tls:
                      print("TLS handshake:", tls.version())
          except Exception as exc:
              print("TLS handshake:", type(exc).__name__)

          status, _ = check("CONTROL other bot id", "https://api.telegram.org/bot123456:invalid_test/getMe", timeout=12)
          own_status, own_result = check("OWN getMe", "https://api.telegram.org/bot" + token + "/getMe", timeout=30)

          if own_status == 200 and own_result.get("ok"):
              username = own_result.get("result", {}).get("username", "")
              print("Authenticated bot username:", username)
              if username.casefold() != "neterucareerhunterbot":
                  raise SystemExit("STOP: GitHub token belongs to a DIFFERENT bot")
              sent_status, _ = check(
                  "OWN sendMessage",
                  "https://api.telegram.org/bot" + token + "/sendMessage",
                  timeout=30,
                  payload={
                      "chat_id": chat_id,
                      "text": "✅ CareerHunterAIBot: тест підключення успішний! Бот може надсилати повідомлення.",
                  },
              )
              if sent_status != 200:
                  raise SystemExit("Bot authenticated, but sendMessage failed; inspect sanitized status")
              print("PASS: test message sent to allowed chat")
          else:
              # Compare same bot ID with a deliberately incorrect secret without printing either.
              # If both hang or return 502 while a different ID gives 401, this points
              # to a bot-specific Telegram infrastructure problem, not a wrong token.
              check("CONTROL own bot id, wrong secret",
                    "https://api.telegram.org/bot" + bot_id + ":" + ("z" * 40) + "/getMe",
                    timeout=25)
              raise SystemExit("Bot API getMe unavailable; see control results above")
          PY
